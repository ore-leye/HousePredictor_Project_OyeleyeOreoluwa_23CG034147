<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>House Price Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; }
        .container { margin-top: 50px; background: white; display: inline-block; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 10px #ccc; }
        input { margin: 10px; padding: 10px; width: 80%; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>House Price Prediction</h2>
        <form action="/predict" method="post">
            <input type="number" name="OverallQual" placeholder="Overall Quality (1-10)" required>
            <input type="number" name="GrLivArea" placeholder="Living Area (sqft)" required>
            <input type="number" name="TotalBsmtSF" placeholder="Total Basement (sqft)" required>
            <input type="number" name="GarageCars" placeholder="Garage Capacity (Cars)" required>
            <input type="number" name="FullBath" placeholder="Full Bathrooms" required>
            <input type="number" name="YearBuilt" placeholder="Year Built (e.g. 1995)" required>
            <br>
            <button type="submit">Predict Price</button>
        </form>
        <h3>{{ prediction_text }}</h3>
    </div>
</body>
</html>
